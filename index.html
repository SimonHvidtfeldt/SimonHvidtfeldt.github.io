<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velkommen | Welcome</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* En simpel styling til din valgside */
        .welcome-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            font-family: sans-serif;
        }
        .info-section {
            margin-bottom: 30px;
            max-width: 500px;
            padding: 20px;
        }
        .language-buttons {
            display: flex;
            gap: 20px;
        }
        .btn {
            padding: 15px 30px;
            text-decoration: none;
            background-color: #333;
            color: white;
            border-radius: 8px;
            font-weight: bold;
        }
        .btn:hover {
            background-color: #555;
        }
    </style>
</head>
<body>

    <div class="welcome-container">
        <div class="info-section">
            <h1>Velkommen / Welcome</h1>
            <p>Her kan du skrive den vigtige information, som du gerne vil have brugeren til at læse først.</p>
        </div>

        <div class="language-buttons">
            <a href="da/Forside.html" class="btn">Dansk</a>
            <a href="en/front_page.html" class="btn">English</a>
        </div>
    </div>

</body>
</html>
